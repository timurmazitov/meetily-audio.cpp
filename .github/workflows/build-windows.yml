name: "Build and Test - Windows"

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - debug
          - release
        default: release
      upload-artifacts:
        description: 'Upload build artifacts'
        required: true
        type: boolean
        default: true

# Cancel duplicate workflow runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine build profile
        id: build-profile
        shell: bash
        run: |
          if [[ "${{ github.event.inputs.build-type }}" == "debug" ]]; then
            echo "profile=debug" >> "$GITHUB_OUTPUT"
            echo "args=--debug" >> "$GITHUB_OUTPUT"
            echo "Build profile: debug"
          else
            echo "profile=release" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "Build profile: release"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Rust 1.99.1
        # Pinned: Rust 1.100's cargo moved build-script OUT_DIR one level deeper; tauri-build 2.6.1 and ort-sys 2.0.0-rc.10 assume the old depth. Unpin after upgrading to tauri-build >= 2.7 and ort >= 2.0.0-rc.14.
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configure portable Windows native build
        id: windows-portability
        shell: pwsh
        env:
          PORTABLE_BUILD_PROFILE: ${{ steps.build-profile.outputs.profile }}
        run: |
          $cmakeHook = (Join-Path $env:GITHUB_WORKSPACE ".github/force-portable-ggml.cmake").Replace('\', '/')
          "CMAKE_PROJECT_INCLUDE=$cmakeHook" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTFLAGS=-C target-cpu=x86-64-v2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # The verifier checks the llama-helper sidecar's ggml CMake cache;
          # the sidecar builds without an explicit --target, so its cache
          # lands in the host target/<profile> directory.
          $buildDirectory = "target/$env:PORTABLE_BUILD_PROFILE"
          $configPath = (Join-Path $env:RUNNER_TEMP "tauri.windows-portable.conf.json").Replace('\', '/')
          @{
            build = @{
              beforeBundleCommand = @{
                script = "node .github/verify-portable-ggml.cjs $buildDirectory"
                cwd = $env:GITHUB_WORKSPACE
              }
            }
          } | ConvertTo-Json -Depth 4 | Set-Content -Path $configPath -Encoding utf8
          "args=--config `"$configPath`"" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          prefix-key: windows-portable-v1
          key: windows-x64-v2

      # No Vulkan SDK install or vulkan-1.dll bundling for the Tauri app:
      # the only transcription engine (transcribe.cpp) loads its prebuilt
      # runtime at execution and uses the driver-provided system Vulkan
      # loader (vulkan-1.dll is never vendored; see
      # frontend/scripts/stage-transcribe-native.mjs). llama-helper below
      # builds CPU-only.

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Build llama-helper sidecar
        shell: pwsh
        run: |
          # Build llama-helper without GPU features (CPU-only)
          # Note: Vulkan build has CMake race condition issues with llama-cpp-sys-2
          # llama-helper is for LLM inference and works fine on CPU
          Write-Host "Building llama-helper sidecar (CPU-only)..."

          # llama.cpp's bundled cpp-httplib does not compile against OpenSSL 4 (const X509_NAME); the helper never uses HTTPS, so build it without OpenSSL.
          $env:CMAKE_DISABLE_FIND_PACKAGE_OpenSSL = "TRUE"
          cargo build --release -p llama-helper

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to build llama-helper"
            exit $LASTEXITCODE
          }

          # Copy binary to binaries directory
          New-Item -ItemType Directory -Force -Path "frontend/src-tauri/binaries" | Out-Null
          Copy-Item "target/release/llama-helper.exe" -Destination "frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe"

          Write-Host "Copied llama-helper to frontend/src-tauri/binaries/"
          Get-ChildItem "frontend/src-tauri/binaries/"

      - name: Cache FFmpeg binary
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/binaries/ffmpeg-*.exe
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('frontend/src-tauri/build.rs', 'frontend/src-tauri/build/ffmpeg.rs') }}
      - name: Cache Windows ONNX Runtime
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/binaries/onnxruntime
          key: ${{ runner.os }}-onnxruntime-x86_64-pc-windows-msvc-${{ hashFiles('frontend/src-tauri/build/onnxruntime.rs') }}


      - name: Stage audio.cpp runtime for bundling
        shell: pwsh
        run: |
          # audioCpp provider (ticket 07): bundle audiocpp.dll + the MSVC
          # runtime bundle next to the executable, hash-pinned to the
          # audio.cpp v0.9.5 release. tauri.windows.conf.json maps
          # frontend/src-tauri/audiocpp-runtime into the install root.
          powershell -ExecutionPolicy Bypass -File "frontend/src-tauri/scripts/stage-audiocpp-runtime.ps1" `
            -Version "v0.9.5" `
            -Archive "audio-v0.9.5-lib-windows-x64-vulkan.zip" `
            -Sha256 "33b16d1afa800c9f73bbcc3d230873296a51fee1dc79512afe0ad14c29fe2d62" `
            -Destination "frontend/src-tauri/audiocpp-runtime"

      - name: Verify audio.cpp runtime staging
        shell: pwsh
        run: |
          $stageDir = "frontend/src-tauri/audiocpp-runtime"
          $required = @(
            "audiocpp.dll",
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcomp140.dll",
            "audio.cpp-LICENSE.txt"
          )
          foreach ($file in $required) {
            $path = Join-Path $stageDir $file
            if (!(Test-Path $path)) {
              Write-Error "Missing staged audio.cpp runtime file: $path"
              exit 1
            }
            Write-Host "OK: $path"
          }

      - name: Stage transcribe.cpp runtime for bundling
        working-directory: frontend
        shell: pwsh
        run: node scripts/stage-transcribe-native.mjs

      - name: Verify transcribe.cpp runtime staging
        working-directory: frontend
        shell: pwsh
        run: node scripts/stage-transcribe-native.mjs --verify

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing (ALWAYS enabled for .sig files)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # License validation RSA public key (embedded at build time)
          SAMOBRANKA_RSA_PUBLIC_KEY: ${{ secrets.SAMOBRANKA_RSA_PUBLIC_KEY }}
          SAMOBRANKA_DOODLE_URL: ${{ vars.SAMOBRANKA_DOODLE_URL }}
          # Supabase configuration (for online license verification)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        with:
          projectPath: frontend
          args: --target x86_64-pc-windows-msvc ${{ steps.build-profile.outputs.args }} ${{ steps.windows-portability.outputs.args }}

      - name: Verify build artifacts
        shell: bash
        run: |
          echo "## Build Artifacts"
          find target/x86_64-pc-windows-msvc/${{ steps.build-profile.outputs.profile }}/bundle -type f \( -name "*.msi" -o -name "*.exe" \) -exec ls -lh {} \;

      - name: Upload artifacts
        if: ${{ github.event.inputs.upload-artifacts == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: samobranka-windows-x64-${{ steps.build-profile.outputs.profile }}-${{ steps.get-version.outputs.version }}
          path: |
            target/x86_64-pc-windows-msvc/${{ steps.build-profile.outputs.profile }}/bundle/msi/*.msi
            target/x86_64-pc-windows-msvc/${{ steps.build-profile.outputs.profile }}/bundle/msi/*.msi.sig
            target/x86_64-pc-windows-msvc/${{ steps.build-profile.outputs.profile }}/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/${{ steps.build-profile.outputs.profile }}/bundle/nsis/*.exe.sig
          retention-days: 30

      - name: Generate build summary
        shell: bash
        run: |
          echo "## 🪟 Windows Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ steps.get-version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Profile** | ${{ steps.build-profile.outputs.profile }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target** | x86_64-pc-windows-msvc |" >> $GITHUB_STEP_SUMMARY
          echo "| **Signed** | ❌ No (code signing not configured) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File Type | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| MSI Installers | $(find target/x86_64-pc-windows-msvc/${{ steps.build-profile.outputs.profile }}/bundle/msi -name "*.msi" 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| MSI Signatures | $(find target/x86_64-pc-windows-msvc/${{ steps.build-profile.outputs.profile }}/bundle/msi -name "*.msi.sig" 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| NSIS Installers | $(find target/x86_64-pc-windows-msvc/${{ steps.build-profile.outputs.profile }}/bundle/nsis -name "*.exe" 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| NSIS Signatures | $(find target/x86_64-pc-windows-msvc/${{ steps.build-profile.outputs.profile }}/bundle/nsis -name "*.exe.sig" 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>📋 File List</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          find target/x86_64-pc-windows-msvc/${{ steps.build-profile.outputs.profile }}/bundle -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.sig" \) 2>/dev/null >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
