name: "Release"

on:
  workflow_dispatch:

# Prevent duplicate releases
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel releases, fail instead

jobs:
  # STEP 1: Create draft release first
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all tags

      - name: Get version from tauri.conf.json and check for existing tags
        id: get-version
        shell: bash
        run: |
          BASE_VERSION=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Base version from tauri.conf.json: $BASE_VERSION"

          git fetch --tags
          VERSION="$BASE_VERSION"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "ERROR: Tag v${VERSION} already exists; bump the application version before releasing."
            exit 1
          fi

          echo "Final version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              target_commitish: context.sha,
              name: `Samobranka v${{ steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            console.log(`Created draft release with ID: ${data.id}`)
            return data.id

  # STEP 2: Build all platforms and upload directly to release
  build-all-platforms:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Apple Silicon only (M1 and above)
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: "--bundles deb,appimage"
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: true
      asset-prefix: "samobranka"
      upload-artifacts: false  # tauri-action uploads directly to release
      release-id: ${{ needs.create-release.outputs.release-id }}
    secrets: inherit

  validate-release:
    needs: [create-release, build-all-platforms]
    # minisign is only packaged for Ubuntu 23.04+ (not 22.04) and is only
    # installed when the updater is enabled, so this job runs on 24.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Assets are listed by release id: the release is still a draft, so it
          # is not reachable by tag yet.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              --header "Accept: application/octet-stream" > "release-assets/$(basename -- "$asset_name")"
          done

      - name: Detect updater public key
        id: updater
        run: |
          set -euo pipefail
          # The presence of plugins.updater.pubkey is the only mode switch of
          # scripts/check-release-assets.py: with a key, signatures are verified
          # and latest.json is written; without one, packages are validated and
          # the manifest is skipped. The updater is disabled today (ADR 0002),
          # so the key path turns itself on once the section is restored.
          python3 - <<'PYCODE'
          import base64, json, os
          from pathlib import Path

          config = json.loads(Path("frontend/src-tauri/tauri.conf.json").read_text())
          pubkey = config.get("plugins", {}).get("updater", {}).get("pubkey")
          if not pubkey:
              print("plugins.updater.pubkey is absent: signatures are not checked, latest.json is not created (ADR 0002).")
              raise SystemExit(0)
          Path("release-assets/public.key").write_bytes(base64.b64decode(pubkey))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("enabled=true\n")
          print("plugins.updater.pubkey is present: signatures will be verified and latest.json will be created.")
          PYCODE

      - name: Install minisign
        if: steps.updater.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Validate release assets
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          args=()
          if [ "${{ steps.updater.outputs.enabled }}" = "true" ]; then
            args+=(--public-key release-assets/public.key)
          fi
          python3 scripts/check-release-assets.py release-assets "$VERSION" "$GITHUB_REPOSITORY" ${args[@]+"${args[@]}"}

      - name: Upload updater manifest
        if: steps.updater.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        run: |
          set -euo pipefail
          # Written by the validation script in key mode only.
          test -f release-assets/latest.json
          upload_url=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.upload_url | split("{")[0]')
          gh api --method POST "$upload_url" --header "Content-Type: application/json" \
            --raw-field "name=latest.json" --input release-assets/latest.json

  # STEP 3: Show release summary
  release-summary:
    needs: [create-release, validate-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get release assets and updater manifest
        id: release-info
        run: |
          set -euo pipefail
          VERSION="${{ needs.create-release.outputs.version }}"
          RELEASE_ID="${{ needs.create-release.outputs.release-id }}"

          echo "## Release Assets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # List all release assets
          echo "### Files in Release" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          gh api repos/${{ github.repository }}/releases/${RELEASE_ID}/assets --jq '.[] | "\(.name) (\(.size / 1048576 | floor)MB)"' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # The updater manifest only exists when the updater is enabled (ADR 0002);
          # its absence is expected and must not fail the summary.
          echo "### latest.json content" >> $GITHUB_STEP_SUMMARY
          LATEST_JSON_ID=$(gh api --paginate "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" --jq '.[] | select(.name == "latest.json") | .id')
          if [ -n "$LATEST_JSON_ID" ]; then
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            gh api "repos/${{ github.repository }}/releases/assets/$LATEST_JSON_ID" --header "Accept: application/octet-stream" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "_No updater manifest: automatic updates are disabled (see ADR 0002)._" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # Download links
          echo "### Download Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release page:** https://github.com/${{ github.repository }}/releases/tag/v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Download all as ZIP:** https://github.com/${{ github.repository }}/archive/refs/tags/v${VERSION}.zip" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Future work (automatic updates are disabled, see ADR 0002):** once the Tauri updater is re-enabled, upload the generated latest.json to \`s3://samobranka-updates/latest.json\`." >> $GITHUB_STEP_SUMMARY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "============================================"
          echo "=== Release Created Successfully ==="
          echo "============================================"
          echo "Version: v${{ needs.create-release.outputs.version }}"
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.create-release.outputs.version }}"
          echo ""
          echo "Uploaded assets (via tauri-action):"
          echo "  - macOS: DMG installer"
          echo "  - Windows: MSI + NSIS installers (SIGNED via signCommand)"
          echo "  - Linux: DEB and AppImage packages, signed explicitly (+ .sig)"
          echo ""
          echo "Automatic updates are disabled (ADR 0002): no app.tar.gz, no macOS or"
          echo "Windows .sig files and no latest.json are produced or uploaded."
          echo ""
          echo "Next steps:"
          echo "  1. Review the draft release"
          echo "  2. Edit release notes if needed"
          echo "  3. Publish the release when ready"
          echo "============================================"

          # Add to GitHub Step Summary
          echo "## Release Created Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ needs.create-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** [View Release](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.create-release.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Uploaded Assets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Assets |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **macOS** | DMG installer |" >> $GITHUB_STEP_SUMMARY
          echo "| **Windows** | MSI installer (SIGNED), NSIS installer (SIGNED) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Linux** | DEB and AppImage packages, signed explicitly (+ .sig) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Automatic updates are disabled (ADR 0002): no app.tar.gz, no macOS or Windows .sig files and no latest.json are produced or uploaded." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. [Review the draft release](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.create-release.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "2. Edit release notes if needed" >> $GITHUB_STEP_SUMMARY
          echo "3. Publish the release when ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
