name: "Build"

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      target:
        required: true
        type: string
      build-args:
        required: false
        type: string
        default: ""
      release-id:
        required: false
        type: string
      asset-prefix:
        required: false
        type: string
        default: "samobranka"
      asset-name-pattern:
        required: false
        type: string
        default: ""
      upload-artifacts:
        required: false
        type: boolean
        default: false
      sign-binaries:
        required: false
        type: boolean
        default: false
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
        default: ${{ github.ref }}
      is-debug-build:
        required: false
        type: boolean
        default: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ${{ inputs.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Get version from tauri.conf.json.
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine build profile
        id: build-profile
        shell: bash
        run: |
          if [[ "${{ inputs.is-debug-build }}" == "true" ]]; then
            echo "profile=debug" >> "$GITHUB_OUTPUT"
            echo "Build profile: debug"
          else
            echo "profile=release" >> "$GITHUB_OUTPUT"
            echo "Build profile: release"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: install Rust 1.99.1
        # Pinned: Rust 1.100's cargo moved build-script OUT_DIR one level deeper; tauri-build 2.6.1 and ort-sys 2.0.0-rc.10 assume the old depth. Unpin after upgrading to tauri-build >= 2.7 and ort >= 2.0.0-rc.14.
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          # Only aarch64-apple-darwin for Apple Silicon (no Intel support)
          targets: ${{ contains(inputs.platform, 'macos') && 'aarch64-apple-darwin' || '' }}

      - name: Configure portable Windows native build
        id: windows-portability
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PORTABLE_BUILD_PROFILE: ${{ steps.build-profile.outputs.profile }}
        run: |
          $cmakeHook = (Join-Path $env:GITHUB_WORKSPACE ".github/force-portable-ggml.cmake").Replace('\', '/')
          "CMAKE_PROJECT_INCLUDE=$cmakeHook" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTFLAGS=-C target-cpu=x86-64-v2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # The verifier checks the llama-helper sidecar's ggml CMake cache.
          # The sidecar is built without an explicit --target, so its cache
          # lands in the host target/<profile> directory.
          $buildDirectory = "target/$env:PORTABLE_BUILD_PROFILE"
          $configPath = (Join-Path $env:RUNNER_TEMP "tauri.windows-portable.conf.json").Replace('\', '/')
          @{
            build = @{
              beforeBundleCommand = @{
                script = "node .github/verify-portable-ggml.cjs $buildDirectory"
                cwd = $env:GITHUB_WORKSPACE
              }
            }
          } | ConvertTo-Json -Depth 4 | Set-Content -Path $configPath -Encoding utf8
          "args=--config `"$configPath`"" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Configure portable Linux native build
        id: linux-portability
        if: runner.os == 'Linux' && inputs.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          PORTABLE_BUILD_PROFILE: ${{ steps.build-profile.outputs.profile }}
        run: |
          echo "CMAKE_PROJECT_INCLUDE=$GITHUB_WORKSPACE/.github/force-portable-ggml.cmake" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C target-cpu=x86-64-v2" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          # The verifier checks the llama-helper sidecar's ggml CMake cache;
          # the sidecar builds without an explicit --target, so its cache
          # lands in the host target/<profile> directory.
          directory = Path('target') / os.environ['PORTABLE_BUILD_PROFILE']
          config = Path(os.environ['RUNNER_TEMP']) / 'tauri.linux-portable.conf.json'
          config.write_text(json.dumps({'build': {'beforeBundleCommand': {
              'script': f'node .github/verify-portable-ggml.cjs {directory}',
              'cwd': os.environ['GITHUB_WORKSPACE'],
          }}}))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'args=--config "{config}"\n')
          PY

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          prefix-key: ${{ runner.os == 'Windows' && 'windows-portable-v1' || (runner.os == 'Linux' && inputs.target == 'x86_64-unknown-linux-gnu' && 'linux-portable-v1') || 'v0-rust' }}
          key: ${{ inputs.platform }}-${{ inputs.target }}-v3

      - name: install dependencies (ubuntu 22.04)
        if: contains(inputs.platform, 'ubuntu-22.04')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libx11-dev libxtst-dev libxrandr-dev

      # No Vulkan SDK install for the Tauri app itself on Windows: the only
      # transcription engine (transcribe.cpp) loads its native runtime at
      # execution and uses the driver-provided system Vulkan loader
      # (vulkan-1.dll is never vendored; see frontend/scripts/stage-transcribe-native.mjs).

      - name: Stage audio.cpp runtime for bundling (Windows)
        if: contains(inputs.platform, 'windows')
        shell: pwsh
        run: |
          # audioCpp provider (ticket 07): bundle audiocpp.dll + the MSVC
          # runtime bundle next to the executable, hash-pinned to the
          # audio.cpp v0.9.5 release. tauri.windows.conf.json maps
          # frontend/src-tauri/audiocpp-runtime into the install root.
          powershell -ExecutionPolicy Bypass -File "frontend/src-tauri/scripts/stage-audiocpp-runtime.ps1" `
            -Version "v0.9.5" `
            -Archive "audio-v0.9.5-lib-windows-x64-vulkan.zip" `
            -Sha256 "33b16d1afa800c9f73bbcc3d230873296a51fee1dc79512afe0ad14c29fe2d62" `
            -Destination "frontend/src-tauri/audiocpp-runtime"

      - name: Verify audio.cpp runtime staging (Windows)
        if: contains(inputs.platform, 'windows')
        shell: pwsh
        run: |
          $stageDir = "frontend/src-tauri/audiocpp-runtime"
          $required = @(
            "audiocpp.dll",
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcomp140.dll",
            "audio.cpp-LICENSE.txt"
          )
          foreach ($file in $required) {
            $path = Join-Path $stageDir $file
            if (!(Test-Path $path)) {
              Write-Error "Missing staged audio.cpp runtime file: $path"
              exit 1
            }
            Write-Host "OK: $path"
          }

      - name: Stage transcribe.cpp runtime for bundling (Linux)
        if: contains(inputs.platform, 'ubuntu')
        working-directory: frontend
        run: node scripts/stage-transcribe-native.mjs

      - name: Verify transcribe.cpp runtime staging (Linux)
        if: contains(inputs.platform, 'ubuntu')
        working-directory: frontend
        run: node scripts/stage-transcribe-native.mjs --verify

      - name: Stage transcribe.cpp runtime for bundling (macOS)
        # macos-latest runners are Apple Silicon, so the script resolves the
        # pinned macos-arm64-metal lane (no Intel macOS lane exists upstream;
        # this workflow only targets aarch64-apple-darwin for macOS).
        if: contains(inputs.platform, 'macos')
        working-directory: frontend
        run: node scripts/stage-transcribe-native.mjs

      - name: Verify transcribe.cpp runtime staging (macOS)
        if: contains(inputs.platform, 'macos')
        working-directory: frontend
        run: node scripts/stage-transcribe-native.mjs --verify

      - name: Prepare Vulkan SDK for Ubuntu 22.04
        if: contains(inputs.platform, 'ubuntu-22.04')
        run: |
          curl -fL --retry 3 https://sdk.lunarg.com/sdk/download/1.4.363.0/linux/vulkansdk-linux-x86_64-1.4.363.0.tar.xz -o "$RUNNER_TEMP/vulkan-sdk.tar.xz"
          echo "197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43  $RUNNER_TEMP/vulkan-sdk.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/vulkan-sdk.tar.xz" -C "$RUNNER_TEMP"
          source "$RUNNER_TEMP/1.4.363.0/setup-env.sh" --set-dep-ld
          test -f "$VULKAN_SDK/include/vulkan/vulkan.h"
          test -f "$VULKAN_SDK/lib/VulkanLoader/lib/libvulkan.so"
          echo "LIBRARY_PATH=$VULKAN_SDK/lib/VulkanLoader/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"
          "$VULKAN_SDK/bin/glslc" --version
          echo "VULKAN_SDK=$VULKAN_SDK" >> "$GITHUB_ENV"
          echo "$VULKAN_SDK/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: rustup install target
        if: ${{ inputs.target != '' && !contains(inputs.target, 'unknown-linux-gnu') && !contains(inputs.target, 'pc-windows-msvc') }}
        run: rustup target add ${{ inputs.target }}

      - name: Import Apple Developer Certificate
        if: contains(inputs.platform, 'macos') && inputs.sign-binaries
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Verify certificate
        if: contains(inputs.platform, 'macos') && inputs.sign-binaries
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
          echo "Certificate imported: $CERT_ID"

      - name: Patch asset name pattern
        id: patch-release-name
        shell: bash
        if: ${{ inputs.release-id != '' && inputs.asset-name-pattern != '' }}
        run: |
          platform="${{ inputs.platform }}"
          replacement="$(echo ${platform} | sed -E 's/-latest//')"
          patched_platform=$(echo '${{ inputs.asset-name-pattern }}' | sed -E "s/\[platform\]/${replacement}/")
          if [[ -n "${{ inputs.asset-prefix }}" ]]; then
            patched_platform="${{ inputs.asset-prefix }}_${patched_platform}"
          fi
          echo "platform=${patched_platform}" >> $GITHUB_OUTPUT

      - name: Build llama-helper sidecar (Windows)
        if: contains(inputs.platform, 'windows')
        shell: pwsh
        run: |
          # Build llama-helper without GPU features (CPU-only)
          # Note: Vulkan build has CMake race condition issues with llama-cpp-sys-2
          # llama-helper is for LLM inference and works fine on CPU
          Write-Host "Building llama-helper sidecar (CPU-only)..."

          # llama.cpp's bundled cpp-httplib does not compile against OpenSSL 4 (const X509_NAME); the helper never uses HTTPS, so build it without OpenSSL.
          $env:CMAKE_DISABLE_FIND_PACKAGE_OpenSSL = "TRUE"
          cargo build --release -p llama-helper

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to build llama-helper"
            exit $LASTEXITCODE
          }

          # Copy binary to binaries directory
          New-Item -ItemType Directory -Force -Path "frontend/src-tauri/binaries" | Out-Null
          Copy-Item "target/release/llama-helper.exe" -Destination "frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe"

          Write-Host "Copied llama-helper to frontend/src-tauri/binaries/"
          Get-ChildItem "frontend/src-tauri/binaries/"

      - name: Build llama-helper sidecar (macOS/Linux)
        if: "!contains(inputs.platform, 'windows')"
        shell: bash
        run: |
          echo "Building llama-helper sidecar..."

          # Determine llama-helper features based on platform
          LLAMA_FEATURES=""
          if [[ "${{ inputs.platform }}" == *"macos"* ]]; then
            LLAMA_FEATURES="--features metal"
            echo "Using Metal GPU acceleration for macOS"
          elif [[ "${{ inputs.platform }}" == *"ubuntu"* ]]; then
            LLAMA_FEATURES="--features vulkan"
            echo "Using Vulkan GPU acceleration for Linux"
          fi

          # Build llama-helper from workspace root
          # llama.cpp's bundled cpp-httplib does not compile against OpenSSL 4 (const X509_NAME); the helper never uses HTTPS, so build it without OpenSSL.
          CMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE cargo build --release -p llama-helper $LLAMA_FEATURES

          # Determine target triple and binary extension
          TARGET="${{ inputs.target }}"
          if [[ -z "$TARGET" ]]; then
            TARGET=$(rustc -vV | grep "host:" | awk '{print $2}')
          fi

          # Copy binary to binaries directory
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper frontend/src-tauri/binaries/llama-helper-${TARGET}

          echo "Copied llama-helper to frontend/src-tauri/binaries/llama-helper-${TARGET}"
          ls -la frontend/src-tauri/binaries/

      - name: Cache FFmpeg binary
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/binaries/ffmpeg-*
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('frontend/src-tauri/build.rs', 'frontend/src-tauri/build/ffmpeg.rs') }}    
      - name: Install FUSE for AppImage processing
        if: contains(inputs.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2

      - name: Build with Tauri
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ inputs.sign-binaries && secrets.APPLE_ID || '' }}
          APPLE_ID_PASSWORD: ${{ inputs.sign-binaries && secrets.APPLE_ID_PASSWORD || '' }}
          APPLE_PASSWORD: ${{ inputs.sign-binaries && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.sign-binaries && secrets.APPLE_TEAM_ID || '' }}
          APPLE_CERTIFICATE: ${{ inputs.sign-binaries && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.sign-binaries && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ inputs.sign-binaries && env.CERT_ID || '' }}
          # Tauri updater signing (ALWAYS enabled for .sig files)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # License validation RSA public key (embedded at build time)
          SAMOBRANKA_RSA_PUBLIC_KEY: ${{ secrets.SAMOBRANKA_RSA_PUBLIC_KEY }}
          SAMOBRANKA_DOODLE_URL: ${{ vars.SAMOBRANKA_DOODLE_URL }}
          # Supabase configuration (for online license verification)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        with:
          projectPath: frontend
          includeUpdaterJson: ${{ inputs.release-id == '' }}
          tagName: ${{ inputs.release-id && runner.os != 'Linux' && format('v{0}', steps.get-version.outputs.version) || '' }}
          releaseName: ${{ inputs.release-id && runner.os != 'Linux' && format('v{0}', steps.get-version.outputs.version) || '' }}
          releaseId: ${{ runner.os != 'Linux' && inputs.release-id || '' }}
          args: ${{ inputs.build-args }} ${{ steps.windows-portability.outputs.args }} ${{ steps.linux-portability.outputs.args }}

      - name: Upload artifacts (macOS)
        if: inputs.upload-artifacts && contains(inputs.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.asset-prefix }}-${{ inputs.target }}
          path: |
            target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/dmg/*.dmg
            target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/macos/*.app
            target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/macos/*.app.tar.gz
            target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/macos/*.app.tar.gz.sig
          retention-days: 30

      - name: Remove libwayland-client.so from AppImage
        if: contains(inputs.platform, 'ubuntu')
        run: |
          # Find the AppImage file
          APPIMAGE_PATH=$(find target/${{ steps.build-profile.outputs.profile }}/bundle/appimage -name "*.AppImage" | head -1)

          if [ -n "$APPIMAGE_PATH" ]; then
            echo "Processing AppImage: $APPIMAGE_PATH"

            # Make AppImage executable
            chmod +x "$APPIMAGE_PATH"

            # Extract AppImage
            cd "$(dirname "$APPIMAGE_PATH")"
            APPIMAGE_NAME=$(basename "$APPIMAGE_PATH")

            # Extract using the AppImage itself
            "./$APPIMAGE_NAME" --appimage-extract

            # Remove libwayland-client.so files
            echo "Removing libwayland-client.so files..."
            find squashfs-root -name "libwayland-client.so*" -type f -delete

            # List what was removed for verification
            echo "Files remaining in lib directories:"
            find squashfs-root -name "lib*" -type d | head -5 | while read dir; do
              echo "Contents of $dir:"
              ls "$dir" | grep -E "(wayland|fuse)" || echo "  No wayland/fuse libraries found"
            done

            # AppImageKit's runtime dlopens libfuse.so.2, which stock Ubuntu 22.04+ lacks; the type2 runtime is static.
            wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
            wget -q https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
            echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage" | sha256sum -c -
            echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64" | sha256sum -c -
            chmod +x appimagetool-x86_64.AppImage

            # Repackage AppImage with no-appstream to avoid warnings; extract-and-run avoids needing FUSE for the tool itself
            ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage --no-appstream --runtime-file runtime-x86_64 squashfs-root "$APPIMAGE_NAME"

            # Clean up
            rm -rf squashfs-root appimagetool-x86_64.AppImage runtime-x86_64

            echo "libwayland-client.so removed from AppImage successfully"
          else
            echo "No AppImage found to process"
          fi

      - name: Sign and upload Linux release packages
        if: runner.os == 'Linux' && inputs.release-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ inputs.release-id }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(target/${{ steps.build-profile.outputs.profile }}/bundle/deb/*.deb target/${{ steps.build-profile.outputs.profile }}/bundle/appimage/*.AppImage)
          [[ ${#packages[@]} -eq 2 ]] || { echo "Expected one deb and one AppImage"; exit 1; }
          upload_url=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.upload_url | split("{")[0]')
          for package in "${packages[@]}"; do
            rm -f "$package.sig"
            frontend/node_modules/.bin/tauri signer sign "$package"
            test -s "$package.sig"
            for asset in "$package" "$package.sig"; do
              gh api --method POST "$upload_url" --header "Content-Type: application/octet-stream" \
                --raw-field "name=$(basename "$asset")" --input "$asset"
            done
          done

      - name: Upload artifacts (Linux)
        if: inputs.upload-artifacts && contains(inputs.platform, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.asset-prefix }}-${{ inputs.platform }}-${{ inputs.target }}
          path: |
            target/${{ steps.build-profile.outputs.profile }}/bundle/deb/*.deb
            target/${{ steps.build-profile.outputs.profile }}/bundle/appimage/*.AppImage
            target/${{ steps.build-profile.outputs.profile }}/bundle/rpm/*.rpm
          retention-days: 30

      - name: Upload artifacts (Windows)
        if: inputs.upload-artifacts && contains(inputs.platform, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.asset-prefix }}-${{ inputs.target }}
          path: |
            target/${{ steps.build-profile.outputs.profile }}/bundle/msi/*.msi
            target/${{ steps.build-profile.outputs.profile }}/bundle/msi/*.msi.sig
            target/${{ steps.build-profile.outputs.profile }}/bundle/nsis/*.exe
            target/${{ steps.build-profile.outputs.profile }}/bundle/nsis/*.exe.sig
          retention-days: 30
